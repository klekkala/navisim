# Default configuration for NaviSim-Isaac integration

# NaviSim configuration
navisim:
  sequence_graph:
    graph_path: ""
  elevation_map:
    resolution: [512, 512]
    scale: 1.0

# IsaacSim configuration
isaac:
  simulator:
    physics_dt: 0.01
    rendering_dt: 0.033
  terrain:
    friction: 0.5
    restitution: 0.1
  physx:
    enable_gpu: true
    collision_margin: 0.01

# Gymnasium environment configuration
gymnasium:
  env:
    max_episode_steps: 1000
    reward_collision: -10.0
    reward_goal: 100.0
    reward_step: -0.1
  agent:
    learning_rate: 0.0003
    gamma: 0.99
  training:
    num_episodes: 10000
    eval_frequency: 100
    checkpoint_frequency: 500

# Logging configuration
logging:
  log_level: "INFO"
  log_dir: "logs"
  tensorboard: true
