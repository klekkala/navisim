# agents/sb3_ppo_cfg.yaml

# Stable-Baselines3 PPO configuration for NaviSim navigation
# See: https://stable-baselines3.readthedocs.io/en/master/modules/ppo.html

seed: 42

# Training parameters
n_timesteps: 1000000  # Total training timesteps
n_steps: 2048         # Steps per environment before update (batch size = n_steps * n_envs)

# PPO hyperparameters
policy:
  class_type: ActorCriticPolicy  # PPO policy class
  # Network architecture (shared by actor and critic)
  net_arch:
    - pi: [256, 256, 128]  # Actor (policy) network
      vf: [256, 256, 128]  # Value function (critic) network
  activation_fn: torch.nn.ELU

# PPO algorithm parameters
gamma: 0.99                  # Discount factor
gae_lambda: 0.95            # GAE lambda parameter
ent_coef: 0.005             # Entropy coefficient
vf_coef: 1.0                # Value function loss coefficient
max_grad_norm: 1.0          # Gradient clipping
learning_rate: 0.0003       # Learning rate
clip_range: 0.2             # PPO clipping parameter
n_epochs: 5                 # Number of epochs per update
batch_size: 512             # Mini-batch size
use_sde: false              # Use state-dependent exploration

# Normalization
normalize_input: true        # Normalize observations
normalize_value: true        # Normalize value function

# Logging
verbose: 1
tensorboard_log: null       # Will be set automatically
device: cuda                # Training device
